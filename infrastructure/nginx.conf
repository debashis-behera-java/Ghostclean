# Optional edge proxy for local development (Compose "edge" profile).
# Not started by default. Production TLS termination is a Phase 12 concern.
events {}

http {
  upstream api {
    server api:8080;
  }

  server {
    listen 80;

    # Security headers (Phase 11 minimal hardening, ADR-027: safe
    # directives only — no SPA-specific source lists until the real
    # frontend inventory exists; OAuth 302/callback semantics unchanged).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    server_tokens off;

    location / {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
      # Actuator stays internal; never expose it through the edge proxy.
      return 404;
    }
  }
}
